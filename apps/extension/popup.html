<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>字幕助手</title>
  <style>
    :root {
      --bg: #1f2937;
      --fg: #f9fafb;
      --muted: #9ca3af;
      --accent: #6366f1;
      --ok: #10b981;
      --err: #ef4444;
      --card: #374151;
      --border: #4b5563;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--fg);
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .row label { color: var(--muted); }
    .row select, .row input[type="checkbox"] { accent-color: var(--accent); }
    .row select {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
    }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--err);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .hint {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
    }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
  </style>
</head>
<body>
  <h1>🎬 网页实时双语字幕</h1>

  <div class="row">
    <label for="enabled">启用字幕</label>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="row">
    <label for="sourceLang">源语言</label>
    <select id="sourceLang">
      <option value="auto">自动检测</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="row">
    <label for="targetLang">目标语言</label>
    <select id="targetLang">
      <option value="zh">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">检查后端连接...</span>
  </div>

  <div class="hint" id="hint">
    启动后端：<code>pnpm --filter @app/server dev</code><br />
    首次翻译会下载 ~900MB 模型，请耐心等待。<br />
    关闭本扩展后，建议刷新页面以恢复视频原生声音。
  </div>

  <script src="popup.js"></script>
</body>
</html>
